name: Seed Club
description: >-
  Seed Club is a web3 accelerator and community focused on consumer crypto,
  helping founders build "a dramatically more interesting internet" where the
  value created by online communities is captured by people rather than
  platforms. It runs a cohort-based accelerator (currently SC07: Consumer
  Crypto), a ventures/investment arm, and a portfolio program, alongside a
  broader community of builders, creators, and token communities. Seed Club
  operates as a community-owned organization and publishes a public Community
  Handbook, a blog, and open-source dApp code (Farcaster frames, crowdfunding
  smart contracts). It is a portfolio company of Kindred Ventures. Seed Club is
  a program and community brand rather than an API provider — it exposes no
  public developer platform, REST/GraphQL API, SDKs, or machine-readable
  discovery surface at this time.
